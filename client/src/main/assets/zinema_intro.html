<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZINEMA · Intro</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#08090c;color:#f7f2e6;font-family:system-ui,sans-serif}.stage{height:100%;display:grid;place-items:center;position:relative}.logo{position:relative;width:min(78vw,900px);aspect-ratio:3/1;opacity:0;animation:reveal 1.4s cubic-bezier(.16,1,.3,1) .15s forwards}.logo img{width:100%;height:100%;object-fit:contain;display:block}.shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.9) 49%,transparent 59%);background-size:300% 100%;background-position:100% 0;mask:url(zinema_intro_art.png) center/contain no-repeat;-webkit-mask:url(zinema_intro_art.png) center/contain no-repeat;opacity:0;animation:sweep 1.15s ease-in-out 1.05s forwards;pointer-events:none}.halo{position:absolute;width:65vw;height:30vw;max-width:900px;max-height:360px;background:radial-gradient(ellipse,rgba(206,187,151,.10),transparent 65%);opacity:0;animation:halo 2.8s ease-out forwards;pointer-events:none}button{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);border:1px solid #ffffff25;color:#d9d4ca;background:#ffffff08;border-radius:30px;padding:11px 20px;font:inherit;font-size:13px;cursor:pointer;opacity:0;animation:controls .5s ease 2.8s forwards}button:hover{background:#ffffff15}button:focus-visible{outline:2px solid #f7f2e6;outline-offset:4px}@keyframes reveal{from{opacity:0;transform:scale(.9) translateY(8px);filter:blur(12px)}to{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}}@keyframes sweep{0%{opacity:0;background-position:100% 0}20%{opacity:.6}80%{opacity:.6}100%{opacity:0;background-position:0% 0}}@keyframes halo{0%,100%{opacity:0}45%{opacity:1}}@keyframes controls{to{opacity:1}}@media(prefers-reduced-motion:reduce){.logo{animation:none;opacity:1}.shine,.halo{display:none}button{animation:none;opacity:1}}body.transparent{background:transparent}body.transparent .halo,body.embed button{display:none}

/* Intro cinética: impacto, estelas y asentamiento. */
.stage{perspective:1100px;isolation:isolate}.logo{z-index:3;animation:impact 2.8s cubic-bezier(.16,1,.3,1) .1s forwards;transform-origin:50% 50%}.shine{animation:sweep 1.2s ease-in-out 1.55s forwards}.halo{background:radial-gradient(ellipse,rgba(220,197,159,.22),transparent 65%);animation:flare 3.4s ease-out forwards}.trail{position:absolute;width:min(78vw,900px);aspect-ratio:3/1;pointer-events:none;opacity:0;z-index:1}.trail img{width:100%;height:100%;object-fit:contain}.trail.one{filter:blur(4px);animation:trail-left 1.55s ease-out .15s forwards}.trail.two{filter:blur(8px);animation:trail-right 1.6s ease-out .15s forwards}.beam{position:absolute;left:-30%;width:70%;height:2px;top:50%;background:linear-gradient(90deg,transparent,#f7f2e6,transparent);box-shadow:0 0 18px 2px #d7b78288;opacity:0;z-index:2;pointer-events:none;animation:beam 1.5s cubic-bezier(.2,.6,.3,1) .1s forwards}.beam.second{top:57%;animation-delay:.27s;height:1px}.ring{position:absolute;width:18vw;height:18vw;border:1px solid #e6d7bb66;border-radius:50%;opacity:0;pointer-events:none;animation:ring 1.4s ease-out .6s forwards;z-index:0}.stage:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(240,219,185,.17),transparent 65%);opacity:0;animation:flash .6s ease-out .7s forwards;pointer-events:none}button{animation-delay:3.5s}
@keyframes impact{0%{opacity:0;transform:translateX(-15vw) translateZ(-600px) rotateY(-30deg) rotateZ(-5deg);filter:blur(22px)}18%{opacity:.8;transform:translateX(-4vw) translateZ(-150px) rotateY(-12deg) rotateZ(-2deg);filter:blur(7px)}33%{opacity:1;transform:translateX(0) translateZ(125px) rotateY(4deg) rotateZ(1deg);filter:blur(0);letter-spacing:0}46%{transform:translateX(0) translateZ(-35px) rotateY(-2deg) rotateZ(-.4deg);filter:drop-shadow(0 0 15px #e9d7b455)}62%{transform:translateZ(18px) rotateY(0);filter:drop-shadow(0 0 7px #e9d7b422)}100%{opacity:1;transform:translateZ(0);filter:none}}
@keyframes trail-left{0%{opacity:0;transform:translateX(-55vw) scale(.6)}30%{opacity:.3}70%{opacity:.16;transform:translateX(-4vw) scale(1.03)}100%{opacity:0;transform:translateX(0) scale(1)}}
@keyframes trail-right{0%{opacity:0;transform:translateX(55vw) scale(1.4)}30%{opacity:.18}70%{opacity:.08;transform:translateX(4vw) scale(1.03)}100%{opacity:0;transform:translateX(0) scale(1)}}
@keyframes beam{0%{opacity:0;transform:translateX(-40vw) rotate(-12deg)}25%{opacity:.8}65%{opacity:.6}100%{opacity:0;transform:translateX(150vw) rotate(-12deg)}}
@keyframes ring{0%{opacity:0;transform:scale(.3)}12%{opacity:.5}100%{opacity:0;transform:scale(5)}}
@keyframes flare{0%{opacity:0;transform:scale(.5)}28%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1)}}
@keyframes flash{0%,100%{opacity:0}15%{opacity:.7}}
@media(prefers-reduced-motion:reduce){.logo{animation:none;opacity:1;transform:none;filter:none}.trail,.beam,.ring,.stage:after{display:none}}
body.transparent .stage:after{display:none}
</style></head><body><main class="stage" aria-label="ZINEMA"><div class="halo"></div><div class="trail one"><img src="zinema_intro_art.png" alt="" aria-hidden="true"></div><div class="trail two"><img src="zinema_intro_art.png" alt="" aria-hidden="true"></div><div class="beam"></div><div class="beam second"></div><div class="ring"></div><div class="logo"><img src="zinema_intro_art.png" alt="ZINEMA"><div class="shine"></div></div><button type="button" id="replay">Repetir intro ↻</button></main><script>
// ?transparent=1 mantiene el fondo transparente. ?embed=1 oculta el botón.
const params=new URLSearchParams(location.search);document.body.classList.toggle('transparent',params.get('transparent')==='1');document.body.classList.toggle('embed',params.get('embed')==='1');const today=new Date();document.body.classList.toggle('halloween',today.getMonth()===9&&today.getDate()>=25&&today.getDate()<=31);const reduced=matchMedia('(prefers-reduced-motion: reduce)');const soundEnabled=params.get('sound')!=='0';const logoAudio=new Audio('zinema_logo_sting.ogg');logoAudio.preload='auto';let timer;function completed(){document.dispatchEvent(new CustomEvent('zinema:intro-ended'));if(window.ZinemaIntro&&window.ZinemaIntro.onIntroEnded)window.ZinemaIntro.onIntroEnded()}function schedule(){clearTimeout(timer);if(!reduced.matches){logoAudio.pause();logoAudio.currentTime=0;if(soundEnabled){const playback=logoAudio.play();if(playback&&playback.catch)playback.catch(()=>{})}}timer=setTimeout(completed,reduced.matches?0:3500)}document.querySelector('#replay').addEventListener('click',()=>{for(const el of document.querySelectorAll('.logo,.shine,.halo,.trail,.beam,.ring')){el.style.animation='none';void el.offsetWidth;el.style.animation=''}const stage=document.querySelector('.stage');stage.getAnimations({subtree:true}).forEach(a=>{a.cancel();a.play()});schedule()});schedule();
</script></body></html>
