services:
  zinema:
    build: .
    container_name: zinema-server
    restart: unless-stopped
    ports:
      - "8180:8000"
    environment:
      MOVIES_ROOT: /library/movies
      SERIES_ROOT: /library/series
      DATABASE_PATH: /data/zinema.sqlite3
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      CLIENT_API_TOKEN: ${CLIENT_API_TOKEN:?Set CLIENT_API_TOKEN in .env}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_KEY: ${TMDB_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-es-ES}
      TMDB_SYNC_INTERVAL_HOURS: ${TMDB_SYNC_INTERVAL_HOURS:-24}
      TMDB_SYNC_BATCH_SIZE: ${TMDB_SYNC_BATCH_SIZE:-100}
      TMDB_REQUEST_DELAY_SECONDS: ${TMDB_REQUEST_DELAY_SECONDS:-0.25}
    volumes:
      - type: bind
        source: ${MOVIES_PATH:?Set MOVIES_PATH to the mounted NAS movies folder}
        target: /library/movies
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SERIES_PATH:?Set SERIES_PATH to the mounted NAS series folder}
        target: /library/series
        read_only: true
        bind:
          create_host_path: false
      - ./data:/data
