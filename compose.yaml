services:
  zinema:
    build: .
    container_name: zinema-server
    restart: unless-stopped
    ports:
      - "8180:8000"
    environment:
      MOVIES_ROOT: /library/movies
      SERIES_ROOT: /library/series
      INCOMING_ROOT: /incoming
      MOVIES_DISPLAY_ROOT: ${MOVIES_PATH:?Set MOVIES_PATH to the mounted NAS movies folder}
      SERIES_DISPLAY_ROOT: ${SERIES_PATH:?Set SERIES_PATH to the mounted NAS series folder}
      INCOMING_DISPLAY_ROOT: ${INCOMING_PATH:-/d/NAS/Incoming}
      DATABASE_PATH: /data/zinema.sqlite3
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_KEY: ${TMDB_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-es-ES}
      TMDB_SYNC_INTERVAL_HOURS: ${TMDB_SYNC_INTERVAL_HOURS:-24}
      TMDB_SYNC_BATCH_SIZE: ${TMDB_SYNC_BATCH_SIZE:-100}
      TMDB_REQUEST_DELAY_SECONDS: ${TMDB_REQUEST_DELAY_SECONDS:-0.25}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_PATH: /data/telegram/zinema
      TELEGRAM_TARGET: ${TELEGRAM_TARGET:--1001764210415}
    volumes:
      - type: bind
        source: ${MOVIES_PATH:?Set MOVIES_PATH to the mounted NAS movies folder}
        target: /library/movies
        bind:
          create_host_path: false
      - type: bind
        source: ${SERIES_PATH:?Set SERIES_PATH to the mounted NAS series folder}
        target: /library/series
        bind:
          create_host_path: false
      - type: bind
        source: ${INCOMING_PATH:-/d/NAS/Incoming}
        target: /incoming
        bind:
          create_host_path: false
      - ./data:/data
